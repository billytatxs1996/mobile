        <!-- 筛选弹窗 -->
        <div class="bottom-modal" id="filter-modal">
            <div class="bottom-modal-content">
                <div class="bottom-modal-header">
                    <h3 class="bottom-modal-title">筛选条件</h3>
                    <button class="bottom-modal-close">&times;</button>
                </div>
                <div class="bottom-modal-body">
                    <div class="modal-option-group">
                        <div class="modal-option-title">作业时间</div>
                        <div class="form-group">
                            <input type="date" id="filter-date" class="form-control">
                        </div>
                    </div>
                    <div class="modal-option-group">
                        <div class="modal-option-title">作业状态</div>
                        <div class="modal-option-list">
                            <div class="modal-option-item" data-value="全部">全部</div>
                            <div class="modal-option-item" data-value="进行中">进行中</div>
                            <div class="modal-option-item" data-value="待开始">待开始</div>
                            <div class="modal-option-item" data-value="已完成">已完成</div>
                        </div>
                    </div>
                </div>
                <div class="bottom-modal-footer">
                    <button class="bottom-modal-btn secondary" id="filter-reset">重置</button>
                    <button class="bottom-modal-btn primary" id="filter-confirm">确认</button>
                </div>
            </div>
        </div>
